# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions
#
# DEPLOYMENT TARGET: Azure App Service — MCInternalWorkbench
# ENTRY POINT:       streamlit_app.py  (do NOT edit versioned copies; edit this file only)
# TRIGGER:           Every push to main branch auto-deploys. Use workflow_dispatch to deploy manually.

name: Build and deploy Python app to Azure Web App - MCInternalWorkbench

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create and start virtual environment and install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'MCInternalWorkbench'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          # Note: startup-command is not supported with publish-profile auth scheme.
          # Set the startup command once in Azure App Service configuration:
          #   python -m streamlit run streamlit_app.py --server.port 8000 --server.address 0.0.0.0

      - name: Verify deployment commit
        run: echo "Deployed commit ${{ github.sha }} to MCInternalWorkbench"